<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page Not Found — Hi Grove Technologies</title>
    <meta name="description" content="The page you are looking for does not exist. Return to Hi Grove Technologies home page.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="IMG_20260724_140923.png.jpeg" sizes="any">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #050505;
            --green: #12792f;
            --green-2: #73f93e;
            --glow: #62ff5a;
            --white: #F8FAFC;
            --gray: #94A3B8;
            --font-display: 'Sora', sans-serif;
            --font-body: 'Inter', sans-serif;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--white);
            font-family: var(--font-body);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-family: var(--font-display);
            color: var(--green-2);
            font-size: 6rem;
            margin: 0 0 20px 0;
        }
        h2 {
            font-family: var(--font-display);
            font-size: 2rem;
            margin-bottom: 20px;
        }
        p {
            color: var(--gray);
            margin-bottom: 40px;
            font-size: 1.1rem;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--green), var(--green-2));
            color: #03150a;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: transform .3s ease, box-shadow .3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(34, 197, 94, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you're looking for doesn't exist, has been removed, or is temporarily unavailable.</p>
        <a href="/" class="btn-primary">Return to Homepage</a>
    </div>
</body>
</html>
